---
layout: default
---
<div class="layout">
  <aside class="left">
    {% if page.left_image %}
      <div class="left-image">
        <img src="{{ page.left_image | relative_url }}" alt="{{ page.left_image_alt | default: page.title }}">
      </div>
    {% endif %}
  </aside>

  <main id="content" tabindex="-1">
    {{ content }}
  </main>

  <aside class="right">
    {% include auto_toc.html %}
  </aside>
</div>
